services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: actuary
      POSTGRES_PASSWORD: actuary
      POSTGRES_DB: claims
    ports:
      - "55432:5432"
    volumes:
      # 首次启动按文件名顺序执行：schema -> 种子数据 -> SQL 补录示例
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actuary -d claims"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://actuary:actuary@db:5432/claims
      MAX_SESSIONS: "2"
      SESSION_TTL_SECONDS: "60"
      PAGE_SIZE_CAP: "100"
      # 开启后可用 X-Debug-Sleep-Seconds 头制造慢取页，
      # 并注册 /debug/* 故障注入接口（归还失败/恢复演示），供演示使用
      ENABLE_DEBUG_HOOKS: "true"
      SWEEPER_INTERVAL_SECONDS: "0.25"
      POOL_MIN_SIZE: "1"
      POOL_MAX_SIZE: "10"
    ports:
      - "8000:8000"

volumes:
  pgdata:
